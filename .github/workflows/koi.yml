name: Generate Git Koi

on:
  schedule:
    # Runs everyday at 00:05 UTC to process the previous day's activity
    - cron: '5 0 * * *'
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/koi.yml

permissions:
  contents: write

jobs:
  draw-koi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run git-profile-koi
        uses: yalongwastaken/git-koi@v1.0.2
        with:
          login: raynbowy23
          body: white   # Options: white, black, asagi, tea, gold, platinum
          output-dir: koi
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koi/koi.gif
          if git diff --staged --quiet; then
            echo "Koi has not changed. Nothing to commit."
          else
            git commit -m "chore: update daily koi animation"
            git push
          fi
